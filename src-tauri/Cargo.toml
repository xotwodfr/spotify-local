[package]
name = "spotify-local"
version = "1.0.0"
description = "Self-hosted Spotify-style Navidrome client — native desktop shell"
authors = ["xotwodfr <fsidblad@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
